plugins {
    id 'dev.architectury.loom' version '1.11.454' apply false
    id 'architectury-plugin' version '3.4.162'
    id 'com.gradleup.shadow' version '8.3.11' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        // Optional integrations (compile-only)
        maven { url = 'https://maven.blamejared.com/' ; content { includeGroup 'mezz.jei' } }
        maven { url = 'https://maven.terraformersmc.com/releases/' ; content { includeGroup 'dev.emi'; includeGroup 'com.terraformersmc' } }
        maven { url = 'https://maven.shedaniel.me/' ; content { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth'; includeGroup 'dev.architectury' } }
        maven { url = 'https://maven2.bai.lol/' ; content { includeGroup 'mcp.mobius.waila'; includeGroup 'lol.bai' } }
        exclusiveContent {
            forRepository { maven { url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = 'UTF-8'
    }

    // The LGPL asks for its text to travel with the jars
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) { rename { "LICENSE_$rootProject.archives_name" } }
        from(rootProject.file('NOTICE')) { rename { "NOTICE_$rootProject.archives_name" } }
    }
}
