plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    runs {
        // Loom's Unprotect plugin widens access on every Minecraft and NeoForge class at load time and asks ModLauncher
        // to recompute stack frames for each one. On a dedicated server that frame computation resolves client-only
        // supertypes (net.minecraft.client.Minecraft via NeoForge's ClientPayloadHandler) and the dist cleaner kills
        // the server in NetworkInitialization. Server-side runs don't need widened access, so switch it off there.
        server {
            property 'unprotect.target', 'none'
        }
        // Headless GameTest server: runs every carpentersblocks test, then exits with the number of failed tests
        gameTestServer {
            server()
            name 'GameTest Server'
            runDir 'build/gametest'
            property 'neoforge.enableGameTest', 'true'
            property 'neoforge.gameTestServer', 'true'
            property 'unprotect.target', 'none'
            property 'neoforge.enabledGameTestNamespaces', 'carpentersblocks'
        }
        // -Pautoshots=<script>: the dev client runs the script's commands and screenshots, then quits (AutoShots)
        if (project.hasProperty('autoshots')) {
            client {
                property 'carpentersblocks.autoshots', project.property('autoshots').toString()
            }
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Optional: only for the annotation REI scans for on NeoForge (see NeoForgeReiPlugin)
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:$rootProject.rei_version") { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // -Pdevmods=jei,jade,...: put other mods on the dev client to check the integrations in game. Local runtime
    // only: never in the jars, the published metadata or a run without the property.
    def devMods = [
        // Later JEI jars were built with a newer Loom than ours, which refuses them
        jei: ["mezz.jei:jei-$rootProject.minecraft_version-neoforge:19.44.0.406"],
        emi: ["dev.emi:emi-neoforge:$rootProject.emi_version"],
        rei: ["me.shedaniel:RoughlyEnoughItems-neoforge:$rootProject.rei_version"],
        jade: ["maven.modrinth:jade:$rootProject.jade_version+neoforge"],
        wthit: ["mcp.mobius.waila:wthit:neo-$rootProject.wthit_version", "lol.bai:badpackets:neo-0.8.2"],
    ]
    if (project.hasProperty('devmods')) {
        project.property('devmods').toString().split(',').each { name ->
            // A set only one loader has (modmenu, sodium...) is skipped on the other
            devMods.getOrDefault(name, []).each { modLocalRuntime it }
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
