plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    runs {
        // Loom's Unprotect plugin widens access on every Minecraft and NeoForge class at load time and asks ModLauncher
        // to recompute stack frames for each one. On a dedicated server that frame computation resolves client-only
        // supertypes (net.minecraft.client.Minecraft via NeoForge's ClientPayloadHandler) and the dist cleaner kills
        // the server in NetworkInitialization. Server-side runs don't need widened access, so switch it off there.
        server {
            property 'unprotect.target', 'none'
        }
        // Headless GameTest server: runs every carpentersblocks test, then exits with the number of failed tests
        gameTestServer {
            server()
            name 'GameTest Server'
            runDir 'build/gametest'
            property 'neoforge.enableGameTest', 'true'
            property 'neoforge.gameTestServer', 'true'
            property 'unprotect.target', 'none'
            property 'neoforge.enabledGameTestNamespaces', 'carpentersblocks'
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Optional: only for the annotation REI scans for on NeoForge (see NeoForgeReiPlugin)
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:$rootProject.rei_version") { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
